spring:
  application:
    name: cortex-sign-api

  servlet:
    multipart:
      max-file-size: ${DOCUMENT_UPLOAD_MAX_FILE_SIZE:25MB}
      max-request-size: ${DOCUMENT_UPLOAD_MAX_REQUEST_SIZE:30MB}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cortex_sign}
    username: ${DB_USER:cortex_sign}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

app:
  frontend:
    base-url: ${APP_FRONTEND_URL:http://localhost:5173}

  notificacao:
    email:
      from: ${MAIL_FROM:}
      from-name: ${MAIL_FROM_NAME:Xsign}
      reply-to: ${MAIL_REPLY_TO:}

  email-verificacao:
    expiration-minutes: ${EMAIL_VERIFICATION_EXPIRATION_MINUTES:60}

  storage:
    provider: ${STORAGE_PROVIDER:LOCAL}
    local:
      base-path: ${LOCAL_STORAGE_PATH:./storage}

  documento:
    upload:
      max-size-mb: ${DOCUMENT_UPLOAD_MAX_SIZE_MB:25}

  assinatura:
    provider: ${SIGNATURE_PROVIDER:CORTEX_SIGN}
    solicitacao:
      validade-dias: ${SIGNATURE_REQUEST_EXPIRATION_DAYS:7}
    acesso-externo:
      codigo-expiracao-minutos: ${EXTERNAL_SIGNER_CODE_EXPIRATION_MINUTES:15}
      token-expiracao-dias: ${EXTERNAL_SIGNER_ACCESS_EXPIRATION_DAYS:30}

  certificado:
    verificacao:
      base-url: ${CERTIFICATE_VERIFICATION_BASE_URL:http://localhost:8080/api/certificados/verificar}

  whatsapp:
    webhook:
      verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}

  seed:
    super-admin:
      enabled: ${SEED_SUPER_ADMIN_ENABLED:false}
      name: ${SEED_SUPER_ADMIN_NAME:Super Administrador}
      email: ${SEED_SUPER_ADMIN_EMAIL:}
      password: ${SEED_SUPER_ADMIN_PASSWORD:}
