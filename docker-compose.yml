services:
  postgres:
    image: postgres:16-alpine
    container_name: cortex-sign-postgres
    environment:
      POSTGRES_DB: cortex_sign
      POSTGRES_USER: cortex_sign
      POSTGRES_PASSWORD: cortex_sign
    ports:
      - "5432:5432"
    volumes:
      - cortex_sign_postgres_data:/var/lib/postgresql/data

volumes:
  cortex_sign_postgres_data: