services:
  postgres:
    image: postgres:16-alpine
    container_name: cortex-sign-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - cortex_sign_postgres_data:/var/lib/postgresql/data

volumes:
  cortex_sign_postgres_data:
